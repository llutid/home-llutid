<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Llutid+</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');  
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1c1c1c;
      font-family: 'Roboto', sans-serif;
      color: white;
      padding: 0;
      overflow-x: hidden;
    }

    /* Intro */
    .intro-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #000000, #0a0a0a);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .logo-container {
      font-size: 4rem;
      font-weight: 800;
      color: white;
      opacity: 0;
      letter-spacing: 4px;
      animation: fadeInZoom 2s ease-out forwards, fadeOut 1s ease-in forwards 4s;
      text-shadow: 0 0 10px #00bfff88, 0 0 20px #00bfff44;
      font-family: 'Montserrat', sans-serif;
    }

    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(1.05);
      }
    }

    /* Página principal */
    .main-content {
      display: none;
    }

    /* Resto del código */
    .logo {
      width: 100px;
      height: auto;
    }
    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .slider-container {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
      border-bottom: 5px solid #555;
    }
    .slider {
      display: flex;
      width: 300%;
      animation: slide 20s infinite; 
    }
    .slider img {
      width: 33.33%;
      height: 100%;
      object-fit: cover;
    }
    @keyframes slide {
      0% { transform: translateX(0); }
      33% { transform: translateX(-100%); }
      66% { transform: translateX(-200%); }
      100% { transform: translateX(0); }
    }
    h1 {
      margin: 20px 0;
      font-size: 2em;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #b0b0b0;
    }
    .search-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }
    .search-container input {
      padding: 12px;
      width: 80%;
      max-width: 400px;
      font-size: 16px;
      border-radius: 5px;
      border: 2px solid #b0b0b0;
      outline: none;
      background-color: #2a2a2a;
      color: white;
    }
    .movie-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .movie {
      background-color: #3a3a3a;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease-in-out;
      cursor: pointer;
    }
    .movie:hover {
      transform: scale(1.05);
    }
    .movie img {
      width: 100%;
      height: auto;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    .movie p {
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #d3d3d3;
    }
    @media (max-width: 600px) {
      .slider-container {
        height: 150px;
      }
      h1 {
        font-size: 1.5em;
      }
      .search-container input {
        font-size: 14px;
        padding: 10px;
      }
      .movie-container {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
      .movie p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Pantalla de animación inicial -->
  <div class="intro-screen">
    <div class="logo-container">LLUTID</div>
  </div>

  <!-- Contenido principal -->
  <div class="main-content">
    <header>
      <div class="slider-container">
        <div class="slider">
          <img src="https://img.freepik.com/vector-premium/cartel-anuncio-espectaculo-pelicula-cine_124507-9983.jpg" alt="Anuncio 1">
          <img src="https://i.postimg.cc/nrHgSb4q/llutid-cine-anuncio.png" alt="Anuncio 2">
          <img src="https://i.postimg.cc/3NbdWyx6/llutid-cine-streaming.png" alt="Anuncio 3">
          <img src="https://img.freepik.com/vector-premium/cartel-anuncio-espectaculo-pelicula-cine_124507-9983.jpg" alt="Anuncio 1">
          <img src="https://i.postimg.cc/nrHgSb4q/llutid-cine-anuncio.png" alt="Anuncio 2">
          <img src="https://i.postimg.cc/3NbdWyx6/llutid-cine-streaming.png" alt="Anuncio 3">
        </div>
      </div>
      <h1>cine llutid</h1>
      <div class="search-container">
        <input type="text" id="search" placeholder="Buscar película..." onkeyup="buscarPelicula()">
      </div>
    </header>
    <div class="movie-container" id="movie-container"></div>
    
    <script>
    // Después de 5.5 segundos, ocultar animación y mostrar contenido
    setTimeout(() => {
      document.querySelector('.intro-screen').style.display = 'none';
      document.querySelector('.main-content').style.display = 'block';
    }, 5500);

    
  
  const peliculas = [
    { title: "Intensamente 2", image: "https://i.postimg.cc/DfH1cd7w/o3413284-16754682.png", link: "https://llutid.github.io/intensamente-2/" },
    { title: "Las Rubias", image: "https://i.postimg.cc/rsrWDzWH/rubias.png", link: "https://llutid.github.io/y-donde-estan-las-rubias-/" },
    { title: "Virus", image: "https://i.postimg.cc/Pfg1hc0M/virus.png", link: "https://llutid.github.io/virus-peli/" },
    { title: "Olé, El Viaje de Ferdinand", image: "https://i.postimg.cc/J0D3jpwP/ole-viaje-de-ferdinad.png", link: "https://llutid.github.io/ole-el-viaje-de-ferdinad-/" },
    { title: "Sgt. Stubby", image: "https://i.postimg.cc/0Q3DzHjP/sgt-stuby.png", link: "https://llutid.github.io/sgt-stuby-/" },
    
    // Nuevas películas
    { title: "Un Don Excepcional", image: "https://i.postimg.cc/WzWKqVrt/un-don-exepcional.png", link: "https://llutid.github.io/un-don-excepcional-/" },
    { title: "En Pie de Guerra", image: "https://i.postimg.cc/3rj42RdP/en-pie-de-guerra.png", link: "https://llutid.github.io/pata-de-guerra/" },
    { title: "Tiburón Toro 2", image: "https://i.postimg.cc/K8j1XDJ2/tiburon-toro-2.png", link: "https://llutid.github.io/tiburon-toro-/" },
    { title: "La Razón de Estar Contigo 1", image: "https://i.postimg.cc/Y2x0hsP7/la-razon-1.png", link: "https://llutid.github.io/la-razon-de-estar-contigo-1/" },
    { title: "La Razón de Estar Contigo 2", image: "https://i.postimg.cc/J46hQBmd/la-razon-2.png", link: "https://llutid.github.io/la-razon-de-estar-2/" },
    { title: "Terrifer 1", image: "https://i.postimg.cc/GpYhr7DZ/terrifer-1.png", link: "https://llutid.github.io/terrifer-1/" },
    { title: "La Exorcista", image: "https://i.postimg.cc/C5vwJWyf/la-exorcista.png", link: "https://llutid.github.io/la-exorcista-/" },
    { title: "Desvastación", image: "https://i.postimg.cc/rF8Jr7FN/desvastacion.png", link: "https://llutid.github.io/huracan-searson/" },
    { title: "El Paseo 5", image: "https://i.postimg.cc/Qdmv7p3H/paseo-5.png", link: "https://llutid.github.io/el-paseo-5/" },
    { title: "El Paseo 7", image: "https://i.postimg.cc/5ttTS64p/paseo-7.png", link: "https://llutid.github.io/el-paseo-7/" },
    { title: "Dios Cambió su Vida", image: "https://i.postimg.cc/BQshCXND/dios-cambio-su-vida.png", link: "https://llutid.github.io/dios-cambio-su-vida-para-siempre/" },
    { title: "Encanto", image: "https://i.postimg.cc/QCnrc15Q/encanto.png", link: "https://llutid.github.io/encanto-peli/" },
    { title: "Un Gran Chico", image: "https://i.postimg.cc/tCYbpvQ2/un-gran-chico.png", link: "https://llutid.github.io/un-gran-chico-/" },
    { title: "Camp Cool Kids", image: "https://i.postimg.cc/0ySqJ6NS/camp-cool-kids.png", link: "https://llutid.github.io/camp-cool-kids/" },
    { title: "El Gran Asalto", image: "https://i.postimg.cc/fL84hm8G/asalto-al-furgon.png", link: "https://llutid.github.io/asalto-al-furgon-blindado-/" },
    { title: "Patos", image: "https://i.postimg.cc/66GsP2dm/patos.png", link: "https://llutid.github.io/patos-la/" },
    { title: "Viaje Mágico", image: "https://i.postimg.cc/0j4LzxRZ/fautland.png", link: "https://llutid.github.io/fauntland-peli/" },
    { title: "Hacker", image: "https://i.postimg.cc/zXLs9LKQ/hacker.png", link: "https://llutid.github.io/hacker-pelicula/" },
    { title: "Hombre Araña", image: "https://i.postimg.cc/GtnXV2CW/hombre-ara-a.png", link: "https://llutid.github.io/hombre-ara-a-2/" },
    { title: "Perro Rokero 2", image: "https://i.postimg.cc/tJ8MX5WM/perro-rokero-2.png", link: "https://llutid.github.io/perro-rokero-2/" },
    { title: "El Voto", image: "https://i.postimg.cc/V6gwL3kH/el-voto.png", link: "https://llutid.github.io/el-voto-pelicula/" },
    { title: "Instakiller", image: "https://i.postimg.cc/J4nrt4J3/instakiller.png", link: "https://llutid.github.io/instakiller-peli/" },
    { title: "Mi Loca Familia", image: "https://i.postimg.cc/vBkJBbdh/mi-loca-familia.png", link: "https://llutid.github.io/mi-loca-familia-/" },
    { title: "Leny", image: "https://i.postimg.cc/7LvwB3RX/leny.png", link: "https://llutid.github.io/leny-el-perro/" },
    { title: "2 Tontos", image: "https://i.postimg.cc/yNFB2J4K/2-tontos.png", link: "https://llutid.github.io/2-tontos-todavia-mas-tontos/" },
    { title: "It 2", image: "https://i.postimg.cc/2SrP30gs/payaso-it.png", link: "https://llutid.github.io/payaso-it-/" },
    { title: "Desastre: La Película", image: "https://i.postimg.cc/7YyRQBP5/desastre-pelicula.png", link: "https://llutid.github.io/desastre-de-la-pelicula/" }
  ];

  const container = document.getElementById("movie-container");
  peliculas.forEach(pelicula => {
    const movieElement = document.createElement("div");
    movieElement.className = "movie";
    movieElement.innerHTML = `<img src="${pelicula.image}" alt="${pelicula.title}"><p>${pelicula.title}</p>`;
    movieElement.onclick = () => {
      window.location.href = pelicula.link;
    };
    container.appendChild(movieElement);
  });

  function buscarPelicula() {
    const input = document.getElementById("search").value.toLowerCase();
    document.querySelectorAll(".movie").forEach(movie => {
      const title = movie.querySelector("p").innerText.toLowerCase();
      movie.style.display = title.includes(input) ? "block" : "none";
      movie.style.visibility = title.includes(input) ? "visible" : "hidden";
    });
  }
</script>

</body>
</html>
